[pytest]
# Standalone test config for the hector CLI (this is an open-source repo of its own,
# vendored into the monorepo as a submodule). Running `pytest` from here needs only
# `pytest` + `pyyaml` — no backend, no Docker, no Renode.
#
# `pythonpath = .` puts the repo root on sys.path so `import hector` resolves without
# an editable install.
testpaths = tests
pythonpath = .
addopts = -q
