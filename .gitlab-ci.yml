# CI for the standalone hector CLI repo: lint + unit tests, no Docker/Renode needed.
# The suite is pure-logic (see tests/) and depends only on pytest + the CLI's single
# runtime dependency, pyyaml.
stages: [check]

python:
  stage: check
  image: python:3.12-slim
  before_script:
    - pip install --upgrade pip
    - pip install pytest ruff pyyaml
  script:
    - ruff check .
    - python -m pytest
